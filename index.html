<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Daily Quote App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Daily Quote</h1>
    <h2>to it </h2>
    
    <div id="quote-card" class="card">
      <p id="quote-text">Loading quote...</p>
      <p id="quote-author"></p>
    </div>

    <div class="controls">
      <button id="new-quote">Random Quote</button>
      <button id="copy-quote">Copy</button>
    </div>

    <footer>
      <small>Built by Team — Daily Quote Web App</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
